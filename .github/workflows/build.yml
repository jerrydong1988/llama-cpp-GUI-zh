name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyinstaller ttkbootstrap pillow

      - name: Build executable
        run: python build_exe.py --onefile

      - uses: actions/upload-artifact@v4
        with:
          name: LLaMA-Server-GUI-Windows
          path: dist/LLaMA-Server-GUI.exe

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyinstaller ttkbootstrap pillow

      - name: Build executable
        run: python build_exe.py --onefile

      - uses: actions/upload-artifact@v4
        with:
          name: LLaMA-Server-GUI-Linux
          path: dist/LLaMA-Server-GUI

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LLaMA-Server-GUI-Windows
          path: release/

      - uses: actions/download-artifact@v4
        with:
          name: LLaMA-Server-GUI-Linux
          path: release/

      - name: List release files
        run: ls -lh release/

      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        with:
          files: release/*
          generate_release_notes: true
      - name: Upload artifacts for workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: release/
